---
- name: Install prerequisite packages
  ansible.builtin.apt:
    update_cache: yes
    pkg:
      - wget
      - ca-certificates
      - curl
      - gnupg
      - lsb-release

- name: Download Apache Maven 3.9.8
  ansible.builtin.get_url:
    url: https://archive.apache.org/dist/maven/maven-3/3.9.8/binaries/apache-maven-3.9.8-bin.tar.gz
    dest: /tmp/apache-maven-3.9.8-bin.tar.gz

- name: Extract Maven to /opt
  ansible.builtin.unarchive:
    src: /tmp/apache-maven-3.9.8-bin.tar.gz
    dest: /opt
    remote_src: yes
    extra_opts: ["--strip-components=1"]
    creates: /opt/apache-maven-3.9.8/bin/mvn

- name: Create /opt/maven symlink
  ansible.builtin.file:
    src: /opt/apache-maven-3.9.8
    dest: /opt/maven
    state: link
    force: yes
    follow: no  # Fixes the warning

- name: Configure Maven environment
  ansible.builtin.blockinfile:
    path: /etc/environment
    block: |
      M2_HOME=/opt/maven
      MAVEN_HOME=/opt/maven
      PATH=$PATH:/opt/maven/bin
    marker: "# {mark} ANSIBLE MANAGED BLOCK - MAVEN"

- name: Update shell environment
  ansible.builtin.shell: |
    source /etc/environment
  args:
    executable: /bin/bash

- name: Clean up downloaded tarball
  ansible.builtin.file:
    path: /tmp/apache-maven-3.9.8-bin.tar.gz
    state: absent

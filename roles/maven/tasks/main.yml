# roles/maven_install/tasks/main.yml
---
- name: Install prerequisite packages
  ansible.builtin.apt:
    update_cache: yes
    pkg:
      - wget
      - ca-certificates
      - curl
      - gnupg
      - lsb-release

- name: Download Apache Maven 3.8.9
  ansible.builtin.get_url:
    url: https://archive.apache.org/dist/maven/maven-3/3.9.8/binaries/apache-maven-3.9.8-bin.tar.gz
    dest: /tmp/apache-maven-3.8.9-bin.tar.gz
    
- name: Extract Maven to /opt
  ansible.builtin.unarchive:
    src: /tmp/apache-maven-3.8.9-bin.tar.gz
    dest: /opt
    remote_src: yes
    extra_opts: ["--strip-components=1"]
    creates: /opt/maven/bin/mvn

- name: Create /opt/maven symlink
  ansible.builtin.file:
    src: /opt/apache-maven-3.8.9
    dest: /opt/maven
    state: link
    force: yes

- name: Configure Maven environment
  ansible.builtin.copy:
    dest: /etc/profile.d/maven.sh
    content: |
      export M2_HOME=/opt/maven
      export MAVEN_HOME=/opt/maven
      export PATH=$PATH:/opt/maven/bin
    mode: 0644

- name: Clean up downloaded tarball
  ansible.builtin.file:
    path: /tmp/apache-maven-3.8.9-bin.tar.gz
    state: absent

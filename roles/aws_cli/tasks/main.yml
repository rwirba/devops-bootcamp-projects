---
- name: Install python3-pip, awscli, and jq
  apt:
    name:
      - python3-pip
      - awscli
      - jq
    state: present
    update_cache: yes

- name: Upgrade boto3 and botocore via pip3
  pip:
    name:
      - boto3
      - botocore
    state: latest
    executable: pip3

- name: Install amazon.aws collection
  ansible.builtin.command: ansible-galaxy collection install amazon.aws --force

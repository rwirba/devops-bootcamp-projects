---
- name: Install base packages
  apt:
    name:
      - openjdk-11-jdk
      - lsof
      - curl
      - unzip
    state: present
  tags: always

- name: Configure system limits for Nexus
  pam_limits:
    domain: '*'
    limit_type: '-'
    limit_item: nofile
    value: 65536
  tags: limits

- name: Setup Nexus Repository
  block:
    - name: Ensure nexus group exists
      group:
        name: nexus
        state: present
      tags: nexus_user
      
    - name: Create nexus user
      user:
        name: nexus
        shell: /bin/bash
        home: "/opt/nexus"
        system: yes
        create_home: yes
        group: nexus
      tags: nexus_user

    - name: Download Nexus 3.80.0
      get_url:
        url: https://download.sonatype.com/nexus/3/nexus-3.80.0-06-linux-x86_64.tar.gz
        dest: "/tmp/nexus-3.80.0-06.tar.gz"
      tags: nexus_download

    - name: Extract and install Nexus
      unarchive:
        src: "/tmp/nexus-3.80.0-06.tar.gz"
        dest: "/opt"
        remote_src: yes
        extra_opts: ["--strip-components=1"]
        owner: nexus
        group: nexus
      tags: nexus_install

    - name: Configure Nexus directories
      file:
        path: "{{ item }}"
        state: directory
        owner: nexus
        group: nexus
        mode: '0755'
      loop:
        - "/opt/sonatype-work/nexus3"
        - "/opt/nexus/etc"
      tags: nexus_dirs
    - name: Ensure Nexus bin directory exists
      ansible.builtin.file:
        path: /opt/nexus/bin
        state: directory
        owner: nexus
        group: nexus
        mode: '0755'
        
    - name: Configure JVM options
      template:
        src: nexus.vmoptions.j2
        dest: "/opt/nexus/bin/nexus.vmoptions"
        owner: nexus
        group: nexus
        mode: '0644'
      vars:
        java_xms: "2g"
        java_xmx: "2g"
        max_direct_memory: "2g"
        nexus_data_dir: "/opt/sonatype-work/nexus3"
      tags: nexus_config

    - name: Deploy systemd service
      ansible.builtin.template:
        src: nexus.service.j2
        dest: /etc/systemd/system/nexus.service
        mode: '0644'
     notify: reload systemd
      vars:
        nexus_user: nexus
        nexus_install_dir: "/opt/nexus"
        java_home: "/usr/lib/jvm/java-11-openjdk-amd64"
      notify: reload systemd
      tags: nexus_service

  tags: nexus_setup

- name: Start and enable Nexus service
  systemd:
    name: nexus
    state: started
    enabled: yes
    daemon_reload: yes
  tags: nexus_service

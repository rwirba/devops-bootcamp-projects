---
- name: Create nexus user
  ansible.builtin.user:
    name: nexus
    shell: /bin/bash  # Changed from /bin/false to allow proper service operation
    create_home: no
    group: nexus  # Explicit group assignment

- name: Download Nexus 3.80.0-06
  ansible.builtin.get_url:
    url: https://download.sonatype.com/nexus/3/nexus-3.80.0-06-linux-x86_64.tar.gz
    dest: /tmp/nexus.tar.gz

- name: Extract Nexus
  ansible.builtin.unarchive:
    src: /tmp/nexus.tar.gz
    dest: /opt
    remote_src: yes
    creates: /opt/nexus-3.80.0-06
    owner: nexus  # Added ownership during extraction
    group: nexus

- name: Create symlink /opt/nexus → /opt/nexus-3.80.0-06
  ansible.builtin.file:
    src: /opt/nexus-3.80.0-06
    dest: /opt/nexus
    state: link
    owner: nexus  # Added link ownership
    group: nexus

- name: Create Sonatype work directory
  ansible.builtin.file:
    path: /opt/sonatype-work/nexus3
    state: directory
    owner: nexus
    group: nexus
    mode: '0755'
    recurse: yes

- name: Set ownership for nexus directory
  ansible.builtin.file:
    path: /opt/nexus-3.80.0-06
    owner: nexus
    group: nexus
    recurse: yes

- name: Configure JVM options
  ansible.builtin.blockinfile:  # More reliable than lineinfile for this case
    path: /opt/nexus/bin/nexus.vmoptions
    block: |
      -Xms1g
      -Xmx1g
      -XX:MaxDirectMemorySize=1g
      -Dkaraf.data=/opt/sonatype-work/nexus3
    owner: nexus
    group: nexus
    mode: '0644'
    create: yes

- name: Create nexus systemd service
  ansible.builtin.copy:
    dest: /etc/systemd/system/nexus.service
    content: |
      [Unit]
      Description=Nexus service
      After=network.target
      
      [Service]
      Type=forking
      LimitNOFILE=65536
      ExecStart=/opt/nexus/bin/nexus start
      ExecStop=/opt/nexus/bin/nexus stop
      User=nexus
      Group=nexus  # Added group
      Restart=on-failure
      TimeoutStartSec=300  # Added timeout
      PIDFile=/opt/nexus/nexus.pid
      Environment="JAVA_HOME=/usr/lib/jvm/java-11-openjdk-amd64"  # Added Java home
      
      [Install]
      WantedBy=multi-user.target
    mode: '0644'

- name: Reload and enable service
  ansible.builtin.systemd:
    name: nexus
    state: started
    enabled: yes
    daemon_reload: yes

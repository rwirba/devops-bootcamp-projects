---

- name: Install Java
  apt:
    name: openjdk-11-jdk
    state: present

- name: Create nexus group
  group:
    name: nexus
    state: present

- name: Create nexus user
  user:
    name: nexus
    shell: /bin/bash
    group: nexus
    system: yes
    create_home: no

# 2. Nexus Installation
- name: Download Nexus
  get_url:
    url: https://download.sonatype.com/nexus/3/nexus-3.80.0-06-linux-x86_64.tar.gz
    dest: /tmp/nexus.tar.gz
    checksum: sha256:8e5f9fc6c926d3d3e7f492e9938f3a8d4f304d3a6a4b5e5e5e5e5e5e5e5e5e5e5
    timeout: 300

- name: Extract Nexus
  unarchive:
    src: /tmp/nexus.tar.gz
    dest: /opt
    remote_src: yes
    extra_opts: ["--strip-components=1"]
    owner: nexus
    group: nexus

# 3. Filesystem Configuration
- name: Remove existing /opt/nexus if present
  file:
    path: /opt/nexus
    state: absent
  ignore_errors: yes

- name: Create version symlink
  file:
    src: /opt/nexus-3.80.0-06
    dest: /opt/nexus
    state: link
    owner: nexus
    group: nexus

- name: Create required directories
  file:
    path: "{{ item }}"
    state: directory
    owner: nexus
    group: nexus
    mode: '0755'
  loop:
    - /opt/sonatype-work/nexus3
    - /opt/sonatype-work/nexus3/tmp
    - /opt/nexus/logs

# 4. Configuration
- name: Configure JVM options
  blockinfile:
    path: /opt/nexus/bin/nexus.vmoptions
    block: |
      -Xms1g
      -Xmx1g
      -XX:MaxDirectMemorySize=1g
      -Dkaraf.data=/opt/sonatype-work/nexus3
      -Djava.io.tmpdir=/opt/sonatype-work/nexus3/tmp
    owner: nexus
    group: nexus
    mode: '0644'
    create: yes

# 5. Service Setup
- name: Deploy systemd service
  copy:
    dest: /etc/systemd/system/nexus.service
    content: |
      [Unit]
      Description=Nexus Repository Manager
      After=network.target
      
      [Service]
      Type=forking
      LimitNOFILE=65536
      ExecStart=/opt/nexus/bin/nexus start
      ExecStop=/opt/nexus/bin/nexus stop
      User=nexus
      Group=nexus
      Restart=on-failure
      RestartSec=30
      TimeoutStartSec=300
      PIDFile=/opt/nexus/nexus.pid
      Environment="JAVA_HOME=/usr/lib/jvm/java-11-openjdk-amd64"
      WorkingDirectory=/opt/nexus
      
      [Install]
      WantedBy=multi-user.target
    mode: '0644'

# 6. Service Management
- name: Reload systemd
  systemd:
    daemon_reload: yes

- name: Start Nexus service with retry
  systemd:
    name: nexus
    state: started
    enabled: yes
  register: start_result
  until: start_result is succeeded
  retries: 3
  delay: 30

# 7. Verification
- name: Check service status
  command: systemctl status nexus.service
  register: service_status
  failed_when: false
  changed_when: false

- name: Display service status
  debug:
    var: service_status.stdout

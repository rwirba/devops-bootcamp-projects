apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-sonarqube-logs
  labels: { pv: sonarqube-logs }
spec:
  capacity: { storage: 2Gi }
  accessModes: [ "ReadWriteOnce" ]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values: [ "ip-172-31-24-17" ]
  hostPath:
    path: /var/lib/docker/volumes/sonarqube_logs/_data
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-tomcat-webapps
  labels: { pv: tomcat-webapps }
spec:
  capacity: { storage: 5Gi }
  accessModes: [ "ReadWriteOnce" ]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values: [ "local-node" ]
  hostPath:
    path: /var/lib/docker/volumes/tomcat-webapps/_data
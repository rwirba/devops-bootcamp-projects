apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-sonarqube-extensions
  labels: { pv: sonarqube-extensions }
spec:
  capacity: { storage: 2Gi }
  accessModes: [ "ReadWriteOnce" ]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values: [ "local-node" ]
  hostPath:
    path: /var/lib/docker/volumes/sonarqube_extensions/_data
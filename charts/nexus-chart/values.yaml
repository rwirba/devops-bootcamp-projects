namespace: ezlearn-cicd-ns

image:
  repository: sonatype/nexus3     # or mitechllc/nexus3 if you mirrored
  tag: "latest"
  pullPolicy: IfNotPresent
  pullSecret: ""

replicaCount: 1

service:
  type: ClusterIP
  port: 8081
  targetPort: 8081
  annotations: {}

persistence:
  enabled: true
  existingClaim: "nexus-data-pvc"
  storageClassName: ""
  size: 20Gi

ingress:
  enabled: true
  className: traefik
  host: nexus.mitechnology.org
  path: /
  annotations: {}
  tls:
    enabled: false
    secretName: ""

securityContext:
  runAsUser: 200
  runAsGroup: 200
  fsGroup: 200

resources: {}
nodeSelector: {}
tolerations: []
affinity: {}

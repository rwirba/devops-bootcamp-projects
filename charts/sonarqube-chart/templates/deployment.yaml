apiVersion: apps/v1
kind: Deployment
metadata:
  name: sonarqube
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: sonarqube
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: sonarqube
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sonarqube
    spec:
      {{- if .Values.image.pullSecret }}
      imagePullSecrets:
        - name: {{ .Values.image.pullSecret }}
      {{- end }}
      {{- if .Values.sysctlInit.enabled }}
      initContainers:
        - name: init-sysctl
          image: alpine:3.20
          securityContext: { privileged: true }
          command: ["sh","-c","sysctl -w vm.max_map_count=262144 && sysctl -w fs.file-max=65536"]
      {{- end }}
      containers:
        - name: sonarqube
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: SONAR_ES_BOOTSTRAP_CHECKS_DISABLE
              value: "true"
          ports:
            - containerPort: {{ .Values.service.targetPort }}
          readinessProbe:
            httpGet: { path: "/about", port: {{ .Values.service.targetPort }} }
            initialDelaySeconds: 60
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: "/about", port: {{ .Values.service.targetPort }} }
            initialDelaySeconds: 120
            periodSeconds: 20
          volumeMounts:
            - name: sonarqube-data
              mountPath: /opt/sonarqube/data
            - name: sonarqube-extensions
              mountPath: /opt/sonarqube/extensions
            - name: sonarqube-logs
              mountPath: /opt/sonarqube/logs
      volumes:
        - name: sonarqube-data
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.data.existingClaim }}
        - name: sonarqube-extensions
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.extensions.existingClaim }}
        - name: sonarqube-logs
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.logs.existingClaim }}

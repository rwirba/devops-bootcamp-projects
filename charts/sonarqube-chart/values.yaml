namespace: ezlearn-cicd-ns

image:
  repository: sonarqube           # or mitechllc/sonarqube
  tag: "community"
  pullPolicy: IfNotPresent
  pullSecret: ""

replicaCount: 1

service:
  type: ClusterIP
  port: 9000
  targetPort: 9000
  annotations: {}

persistence:
  data:
    existingClaim: "sonarqube-data-pvc"
  extensions:
    existingClaim: "sonarqube-extensions-pvc"
  logs:
    existingClaim: "sonarqube-logs-pvc"

ingress:
  enabled: true
  className: traefik
  host: sonarqube.mitechnology.org
  path: /
  annotations: {}
  tls:
    enabled: false
    secretName: ""

sysctlInit:
  enabled: true

resources: {}
nodeSelector: {}
tolerations: []
affinity: {}

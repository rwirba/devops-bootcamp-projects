# buildspec.yml (region-forced to us-east-2)
version: 0.2
env:
  variables:
    AWS_DEFAULT_REGION: "us-east-2"          # <----- force region here
    APP_REPO_NAME: "ezlearn-app"
    WAR_URL: "http://<YOUR-NEXUS>/repository/.../your.war"
  exported-variables:
    - IMAGE_URI
phases:
  pre_build:
    commands:
      - set -euo pipefail
      - ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
      - REGION="${AWS_DEFAULT_REGION:-us-east-2}"
      - REPO_URI="${ACCOUNT_ID}.dkr.ecr.${REGION}.amazonaws.com/${APP_REPO_NAME}"
      - echo "Using ECR: ${REPO_URI}"
      - aws ecr describe-repositories --repository-names "${APP_REPO_NAME}" --region "${REGION}" >/dev/null 2>&1 || \
        aws ecr create-repository --repository-name "${APP_REPO_NAME}" --region "${REGION}"
      - aws ecr get-login-password --region "${REGION}" | docker login --username AWS --password-stdin "${REPO_URI}"
  build:
    commands:
      - test -n "${WAR_URL}" || { echo "WAR_URL is required"; exit 1; }
      - IMAGE_TAG="${CODEBUILD_RESOLVED_SOURCE_VERSION:0:7}"
      - echo "Building ${REPO_URI}:${IMAGE_TAG} (and :latest)"
      - docker build --build-arg WAR_URL="${WAR_URL}" -t "${REPO_URI}:${IMAGE_TAG}" -t "${REPO_URI}:latest" .
  post_build:
    commands:
      - docker push "${REPO_URI}:${IMAGE_TAG}"
      - docker push "${REPO_URI}:latest"
      - IMAGE_URI="${REPO_URI}:${IMAGE_TAG}"
      - echo "Pushed: ${IMAGE_URI}"
      - printf '{"imageUri":"%s"}' "${IMAGE_URI}" > imageDetail.json
artifacts:
  files:
    - imageDetail.json

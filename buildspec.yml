version: 0.2

env:
  variables:
    AWS_DEFAULT_REGION: "us-east-2"
    APP_REPO_NAME: "ezlearn-app"
    WAR_URL: "http://nexus.mitechnology.org:8081/repository/ezlearn-release/com/ezlearn/ezlearn/20250913160409/ezlearn-20250913160409.war"
  exported-variables:
    - IMAGE_URI

phases:
  pre_build:
    commands:
      - |
        set -euo pipefail
      - |
        echo "Region: ${AWS_DEFAULT_REGION}"
      - |
        ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
      - |
        REPO_URI="${ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com/${APP_REPO_NAME}"
      - |
        echo "ECR repo: ${REPO_URI}"
      - |
        aws ecr describe-repositories --region "${AWS_DEFAULT_REGION}" --repository-names "${APP_REPO_NAME}" >/dev/null 2>&1 || aws ecr create-repository --region "${AWS_DEFAULT_REGION}" --repository-name "${APP_REPO_NAME}"
      - |
        aws ecr get-login-password --region "${AWS_DEFAULT_REGION}" | docker login --username AWS --password-stdin "${REPO_URI}"

  build:
    commands:
      - |
        test -n "${WAR_URL}" || { echo "WAR_URL is required"; exit 1; }
      - |
        IMAGE_TAG="${CODEBUILD_RESOLVED_SOURCE_VERSION:0:7}"
      - |
        echo "Building ${REPO_URI}:${IMAGE_TAG} and :latest with WAR_URL=${WAR_URL}"
      - |
        docker build --build-arg WAR_URL="${WAR_URL}" -t "${REPO_URI}:${IMAGE_TAG}" -t "${REPO_URI}:latest" .

  post_build:
    commands:
      - |
        docker push "${REPO_URI}:${IMAGE_TAG}"
      - |
        docker push "${REPO_URI}:latest"
      - |
        IMAGE_URI="${REPO_URI}:${IMAGE_TAG}"
      - |
        echo "Pushed ${IMAGE_URI}"
      - |
        printf '{"imageUri":"%s"}' "${IMAGE_URI}" > imageDetail.json

artifacts:
  files:
    - imageDetail.json

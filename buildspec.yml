# buildspec.yml
version: 0.2

env:
  # Put all your vars here so you don't need to click around in the console.
  variables:
    APP_REPO_NAME: "ezlearn-app"                           # ECR repo name
    WAR_URL: "http://nexus.mitechnology.org:8081/repository/ezlearn-release/com/ezlearn/ezlearn/20250913160409/ezlearn-20250913160409.war" # <-- set this
  # If you're using CodePipeline later, this lets you pass IMAGE_URI forward.
  exported-variables:
    - IMAGE_URI

phases:
  pre_build:
    commands:
      - set -euo pipefail
      - echo "Region: ${AWS_DEFAULT_REGION:-us-east-1}"
      - ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
      - REGION=${AWS_DEFAULT_REGION:-us-east-1}
      - REPO_URI="${ACCOUNT_ID}.dkr.ecr.${REGION}.amazonaws.com/${APP_REPO_NAME}"
      - echo "ECR repo URI: ${REPO_URI}"
      # Ensure the ECR repo exists
      - aws ecr describe-repositories --repository-names "${APP_REPO_NAME}" >/dev/null 2>&1 || \
        aws ecr create-repository --repository-name "${APP_REPO_NAME}"
      # Login to ECR
      - aws ecr get-login-password --region "${REGION}" | docker login --username AWS --password-stdin "${REPO_URI}"
  build:
    commands:
      - test -n "${WAR_URL}" || { echo "WAR_URL is required"; exit 1; }
      - IMAGE_TAG="${CODEBUILD_RESOLVED_SOURCE_VERSION:0:7}"
      - echo "Building ${REPO_URI}:${IMAGE_TAG} (and :latest) with WAR_URL=${WAR_URL}"
      - docker build --build-arg WAR_URL="${WAR_URL}" -t "${REPO_URI}:${IMAGE_TAG}" -t "${REPO_URI}:latest" .
  post_build:
    commands:
      - docker push "${REPO_URI}:${IMAGE_TAG}"
      - docker push "${REPO_URI}:latest"
      - IMAGE_URI="${REPO_URI}:${IMAGE_TAG}"
      - echo "Pushed: ${IMAGE_URI}"
      - printf '{"imageUri":"%s"}' "${IMAGE_URI}" > imageDetail.json

artifacts:
  files:
    - imageDetail.json
